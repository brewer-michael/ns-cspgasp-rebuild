name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fonts for the display tests
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  enclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      # exports every printable part; fails if the model's own checks fail
      - run: hardware/enclosure/export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enclosure-stl
          path: hardware/enclosure/stl/
