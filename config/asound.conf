# Open Speaker: /etc/asound.conf (installed by scripts/install.sh)
#
# The googlevoicehat-soundcard overlay drives both MAX98357A amplifiers (I2S out)
# and both INMP441 microphones (I2S in). The card only runs at 48 kHz, 32-bit,
# stereo, so everything is converted and shared here:
#
#   default   plays through the "Master" volume control, records from the mics
#   mics      the two microphones (left, right) at whatever rate is asked for;
#             the speaker records 16 kHz
#   music     plays through its own "Music" control, which the speaker turns down
#             while it talks (for example Spotify Connect via raspotify)
#
# Check with:  aplay -l   arecord -L   speaker-test -D default -c 2 -t sine

# better resampling than the built-in linear converter (from libasound2-plugins)
defaults.pcm.rate_converter "speexrate_medium"

pcm.voicehat_out {
    type dmix
    ipc_key 5970
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:sndrpigooglevoi,0"
        format S32_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.voicehat_in {
    type dsnoop
    ipc_key 5971
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:sndrpigooglevoi,0"
        format S32_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.master {
    type softvol
    slave.pcm "voicehat_out"
    control {
        name "Master"
        card sndrpigooglevoi
    }
    min_dB -48.0
    max_dB 0.0
}

pcm.music_vol {
    type softvol
    slave.pcm "master"
    control {
        name "Music"
        card sndrpigooglevoi
    }
}

pcm.music {
    type plug
    slave.pcm "music_vol"
}

pcm.mics {
    type plug
    slave.pcm "voicehat_in"
}

pcm.!default {
    type asym
    playback.pcm "plug:master"
    capture.pcm "mics"
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}
